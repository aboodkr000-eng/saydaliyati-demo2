<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up · صيدليتي</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
    .auth-header { padding: 1.25rem; display: flex; align-items: center; justify-content: space-between; max-width: 76rem; margin: 0 auto; width: 100%; }
    .auth-brand { display: flex; align-items: center; gap: 0.625rem; font-weight: 700; font-size: 1.0625rem; }
    .auth-main {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 1rem 1.25rem 4rem; position: relative; overflow: hidden;
    }
    .auth-main::before {
      content: ""; position: absolute; top: -200px; left: 50%;
      transform: translateX(-50%); width: 800px; height: 500px;
      border-radius: 999px;
      background: radial-gradient(circle, var(--mint) 0%, transparent 70%);
      opacity: 0.12; filter: blur(120px); pointer-events: none;
    }
    .auth-card {
      position: relative; width: 100%; max-width: 32rem;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 2rem;
      box-shadow: var(--shadow);
    }
    .auth-card h1 {
      font-size: 1.625rem; font-weight: 700;
      letter-spacing: -0.025em; margin: 0 0 0.5rem;
    }
    .auth-card .auth-sub { color: var(--fg-muted); font-size: 0.9375rem; margin: 0 0 1.5rem; }
    .auth-foot { text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--fg-muted); }
    .auth-foot a { color: var(--mint); font-weight: 600; }
    .row-2 { display: grid; gap: 0.875rem; }
    @media (min-width: 540px) { .row-2 { grid-template-columns: 1fr 1fr; } }

    .form-section {
      padding: 1.25rem;
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }
    .form-section h4 {
      margin: 0 0 0.875rem;
      font-size: 0.9375rem; font-weight: 700;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .form-section .form-section-hint {
      margin: -0.5rem 0 0.875rem;
      font-size: 0.8125rem; color: var(--fg-muted);
    }
    #signup-map { height: 260px; }
  </style>
</head>
<body>

<div class="auth-header">
  <a href="/" class="auth-brand">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="2" width="20" height="20" rx="6" fill="#00E5A8"/>
      <path d="M12 7v10M7 12h10" stroke="#000" stroke-width="2.75" stroke-linecap="round"/>
    </svg>
    <span data-i18n="nav.app">صيدليتي</span>
  </a>
  <button class="lang-toggle" onclick="toggleLang()">EN</button>
</div>

<main class="auth-main">
  <div class="auth-card">
    <div class="pill pill-mint pill-no-dot mb-4" id="role-pill" style="font-weight:700"></div>
    <h1 data-i18n="auth.createAccount">أنشئ حسابك</h1>
    <p class="auth-sub" data-i18n="auth.createAccountSub">أخبرنا بمعلومات بسيطة عنك.</p>

    <form id="form" class="stack-md">
      <!-- Client only -->
      <div class="field" id="client-fields">
        <label class="label" data-i18n="auth.fullName">الاسم الكامل</label>
        <input class="input" name="full_name" required placeholder="اسمك الكامل" data-i18n-placeholder="auth.fullNamePlaceholder" />
      </div>

      <!-- Pharmacy only -->
      <div id="pharmacy-fields" class="hidden stack-md">
        <div class="form-section">
          <h4>🏥 <span data-i18n="auth.pharmacyDetails">معلومات الصيدلية</span></h4>
          <div class="row-2">
            <div class="field">
              <label class="label" data-i18n="auth.pharmacyName">الاسم بالإنجليزي</label>
              <input class="input" name="pharmacy_name_en" required placeholder="Al-Hayat Pharmacy" data-i18n-placeholder="auth.pharmacyNamePlaceholder" />
            </div>
            <div class="field">
              <label class="label" data-i18n="auth.pharmacyNameAr">الاسم بالعربي</label>
              <input class="input" name="pharmacy_name_ar" required placeholder="صيدلية الحياة" data-i18n-placeholder="auth.pharmacyNameArPlaceholder" />
            </div>
          </div>
          <div class="row-2 mt-4">
            <div class="field">
              <label class="label" data-i18n="auth.area">المنطقة</label>
              <input class="input" name="area" required placeholder="عبدون" data-i18n-placeholder="auth.areaPlaceholder" />
            </div>
            <div class="field">
              <label class="label" data-i18n="auth.fullName">اسم المالك</label>
              <input class="input" name="full_name_pharmacy" required placeholder="اسمك الكامل" data-i18n-placeholder="auth.fullNamePlaceholder" />
            </div>
          </div>
        </div>

        <div class="form-section">
          <h4>📍 <span data-i18n="auth.pinLocation">موقع الصيدلية</span></h4>
          <p class="form-section-hint" data-i18n="auth.pinHint">اسحب الدبّوس لباب الصيدلية بالضبط.</p>
          <div class="gmap-container" id="signup-map"></div>
          <button type="button" class="btn btn-secondary btn-sm mt-4" id="use-my-location">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
            <span data-i18n="auth.useMyLocation">استخدم موقعي الحالي</span>
          </button>
          <input type="hidden" name="latitude" />
          <input type="hidden" name="longitude" />
        </div>
      </div>

      <div class="field">
        <label class="label" data-i18n="auth.phone">رقم الهاتف</label>
        <div class="input-phone">
          <span class="input-phone-prefix">🇯🇴 +962</span>
          <input class="input" name="phone" type="tel" required dir="ltr" placeholder="7X XXX XXXX" />
        </div>
      </div>

      <div class="field">
        <label class="label" data-i18n="auth.email">البريد الإلكتروني</label>
        <input class="input" name="email" type="email" required dir="ltr" placeholder="you@example.com" />
      </div>

      <div class="field">
        <label class="label" data-i18n="auth.password">كلمة المرور</label>
        <input class="input" name="password" type="password" required minlength="8" placeholder="At least 8 characters" data-i18n-placeholder="auth.passwordPlaceholder" />
      </div>

      <button type="submit" class="btn btn-primary btn-lg btn-block" id="submit-btn">
        <span data-i18n="auth.signUp">أنشئ حساباً</span>
      </button>
    </form>

    <div class="auth-foot">
      <span data-i18n="auth.haveAccount">لديك حساب؟</span>
      <a href="/sign-in" data-i18n="auth.signIn">دخول</a>
    </div>
  </div>
</main>

<script src="/i18n.js"></script>
<script src="/config.js"></script>
<script src="/app.js"></script>
<script src="/maps.js"></script>
<script>
  const role = sessionStorage.getItem("signup_role") || "client";
  const isPharmacy = role === "pharmacy";

  applyLang(currentLang);

  function setRoleFields() {
    const clientFields = document.getElementById("client-fields");
    const pharmacyFields = document.getElementById("pharmacy-fields");
    clientFields.classList.toggle("hidden", isPharmacy);
    pharmacyFields.classList.toggle("hidden", !isPharmacy);
    clientFields.querySelectorAll("input, textarea, select").forEach((el) => (el.disabled = isPharmacy));
    pharmacyFields.querySelectorAll("input, textarea, select").forEach((el) => (el.disabled = !isPharmacy));
  }
  setRoleFields();
  document.getElementById("role-pill").textContent = isPharmacy ? t("role.pharmacy") : t("role.client");

  // Map for pharmacy
  let mapHandle = null;
  function setLatLng(lat, lng) {
    document.querySelector('input[name="latitude"]').value = lat;
    document.querySelector('input[name="longitude"]').value = lng;
  }

  if (isPharmacy) {
    (async () => {
      const lat = 31.9539, lng = 35.9106;
      const container = document.getElementById("signup-map");
      mapHandle = await createDraggableMap({ container, lat, lng, zoom: 12, lang: currentLang });
      if (mapHandle.ok) {
        setLatLng(lat, lng);
        mapHandle.marker.addListener("dragend", () => {
          const p = mapHandle.marker.getPosition();
          setLatLng(p.lat(), p.lng());
        });
        mapHandle.map.addListener("click", (e) => {
          mapHandle.marker.setPosition(e.latLng);
          setLatLng(e.latLng.lat(), e.latLng.lng());
        });
      }
    })();
  }

  document.getElementById("use-my-location").addEventListener("click", () => {
    if (!navigator.geolocation) return toast("Geolocation not supported", "error");
    const btn = document.getElementById("use-my-location");
    btn.disabled = true;
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const lat = pos.coords.latitude, lng = pos.coords.longitude;
        if (mapHandle?.ok) mapHandle.setLocation(lat, lng);
        setLatLng(lat, lng);
        btn.disabled = false;
        toast(t("auth.locationFound"), "success");
      },
      () => { btn.disabled = false; toast(t("auth.locationDenied"), "error"); },
      { timeout: 8000 }
    );
  });

  // Submit
  const form = document.getElementById("form");
  const btn = document.getElementById("submit-btn");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.querySelector("span").textContent = t("auth.creating");
    const data = Object.fromEntries(new FormData(form));
    data.role = role;
    if (isPharmacy && data.full_name_pharmacy) {
      data.full_name = data.full_name_pharmacy;
      delete data.full_name_pharmacy;
    }
    if (data.latitude) data.latitude = parseFloat(data.latitude);
    if (data.longitude) data.longitude = parseFloat(data.longitude);

    try {
      const res = await api("/api/auth/sign-up", { method: "POST", body: data });
      location.href = res.role === "pharmacy" ? "/pharmacy/dashboard" : "/client/home";
    } catch (err) {
      toast(err.message || t("auth.errorGeneric"), "error");
      btn.disabled = false;
      btn.querySelector("span").textContent = t("auth.signUp");
    }
  });
</script>
</body>
</html>
