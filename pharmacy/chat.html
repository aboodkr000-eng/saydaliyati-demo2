<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat · صيدليتي</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

<div class="chat-shell">
  <header class="chat-header">
    <a href="javascript:history.back()" class="icon-btn">
      <svg class="rtl-flip" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </a>
    <div id="chat-peer" class="flex items-center gap-3 flex-1" style="min-width:0">
      <div class="skeleton skeleton-circle"></div>
      <div class="flex-1">
        <div class="skeleton skeleton-line short"></div>
      </div>
    </div>
  </header>

  <div class="chat-messages" id="messages">
    <div class="chat-empty">
      <div class="spinner"></div>
    </div>
  </div>

  <form class="chat-composer" id="composer" autocomplete="off">
    <input class="input" id="msg-input" data-i18n-placeholder="client.typeMessage" placeholder="اكتب رسالة…" />
    <button class="btn btn-primary btn-icon" type="submit">
      <svg class="rtl-flip" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </form>
</div>

<script src="/i18n.js"></script>
<script src="/app.js"></script>
<script src="/sounds.js"></script>
<script>
  applyLang(currentLang);
  const orderId = new URLSearchParams(location.search).get("order");
  let me, peerName, sse;
  let initialMessagesLoaded = false;

  async function init() {
    me = await requireAuth();
    if (!me) return;
    if (!orderId) { history.back(); return; }
    try {
      const order = await api(`/api/orders/${orderId}`);
      peerName = me.role === "client"
        ? (currentLang === "ar" ? order.pharmacy_name_ar : order.pharmacy_name_en)
        : order.client_name;
      document.getElementById("chat-peer").innerHTML = `
        ${avatarHtml(peerName, "md", true)}
        <div class="flex-1" style="min-width:0">
          <strong style="display:block">${peerName}</strong>
          <span class="text-xs muted">${t("status." + order.status)}</span>
        </div>
      `;
      const initial = await api(`/api/messages?order_id=${orderId}`);
      renderMessages(initial);
      initialMessagesLoaded = true;
      connectSSE();
    } catch (err) { toast(err.message, "error"); }
  }

  function bubbleHtml(m) {
    const mine = m.sender_id === me.id;
    return `
      <div class="chat-bubble-row ${mine ? "me" : "them"}">
        <div class="chat-bubble ${mine ? "me" : "them"}">${escapeHtml(m.body)}</div>
        <div class="chat-time">${formatTime(m.created_at)}</div>
      </div>
    `;
  }
  function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

  function renderMessages(msgs) {
    const wrap = document.getElementById("messages");
    if (msgs.length === 0) {
      wrap.innerHTML = `
        <div class="chat-empty">
          <div class="empty-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          </div>
          <h3 style="color:var(--fg);margin:0 0 0.25rem">${t("client.noMessages")}</h3>
          <p>${t("client.noMessagesDesc")}</p>
        </div>
      `;
      return;
    }
    wrap.innerHTML = msgs.map(bubbleHtml).join("");
    wrap.scrollTop = wrap.scrollHeight;
  }
  function appendMessage(m) {
    const wrap = document.getElementById("messages");
    if (wrap.querySelector(".chat-empty")) wrap.innerHTML = "";
    wrap.insertAdjacentHTML("beforeend", bubbleHtml(m));
    wrap.scrollTop = wrap.scrollHeight;
  }

  function connectSSE() {
    sse = new EventSource(`/api/messages/stream?order_id=${orderId}`);
    sse.addEventListener("message", (e) => {
      try {
        const m = JSON.parse(e.data);
        if (m && m.id) {
          appendMessage(m);
          if (initialMessagesLoaded && m.sender_id !== me.id) {
            playChatSound();
            // Tell the server we've now seen this message,
            // so badges on other pages clear.
            api(`/api/messages/read?order_id=${orderId}`, { method: "POST" }).catch(() => {});
          }
        }
      } catch {}
    });
    sse.onerror = () => { setTimeout(connectSSE, 3000); };
  }

  document.getElementById("composer").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = document.getElementById("msg-input");
    const content = input.value.trim();
    if (!content) return;
    input.value = "";
    try {
      await api(`/api/messages`, { method: "POST", body: { order_id: orderId, body: content } });
    } catch (err) { toast(err.message, "error"); }
  });

  init();
</script>
</body>
</html>
