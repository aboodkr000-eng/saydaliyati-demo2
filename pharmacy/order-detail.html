<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order · صيدليتي</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .rx-thumb {
      width: 100%; max-height: 16rem;
      object-fit: cover;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .info-grid {
      display: grid; gap: 0.875rem;
      grid-template-columns: 1fr 1fr;
    }
    .info-cell .label {
      font-size: 0.75rem; color: var(--fg-muted);
      text-transform: uppercase; letter-spacing: 0.04em;
      font-weight: 600;
    }
    .info-cell .value {
      font-size: 0.9375rem; font-weight: 600;
      margin-top: 0.25rem;
    }
    .sticky-chat {
      position: fixed; bottom: 5rem; inset-inline-end: 1rem;
      z-index: 20;
    }
    @media (min-width: 768px) {
      .sticky-chat { bottom: 1.5rem; }
    }
  </style>
</head>
<body>

<div id="nav-mount"></div>

<main class="container">
  <div class="page-header">
    <a href="/pharmacy/orders" class="btn btn-secondary btn-sm">
      <svg class="rtl-flip" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      <span data-i18n="common.back">رجوع</span>
    </a>
  </div>

  <div id="root"><div class="skeleton" style="height: 14rem"></div></div>
</main>

<a id="chat-fab" class="btn btn-white sticky-chat hidden" href="#">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
  <span data-i18n="pharmacy.chatClient">محادثة المريض</span>
</a>

<!-- Quote modal -->
<div class="modal-bg" id="quote-modal">
  <div class="modal">
    <h3 data-i18n="pharmacy.quoteTitle">أرسل عرض السعر</h3>
    <p class="muted text-sm" data-i18n="pharmacy.quoteHint">حدّد السعر النهائي للمريض.</p>
    <form id="quote-form" class="mt-4">
      <div class="field">
        <label class="label" data-i18n="pharmacy.total">المجموع (د.أ)</label>
        <input class="input" name="total" type="number" step="0.01" min="0" required dir="ltr" />
      </div>
      <div class="flex gap-3 mt-6">
        <button type="button" class="btn btn-secondary flex-1" onclick="closeModal()" data-i18n="common.cancel">إلغاء</button>
        <button type="submit" class="btn btn-primary flex-1" data-i18n="pharmacy.sendQuote">إرسال العرض</button>
      </div>
    </form>
  </div>
</div>

<script src="/i18n.js"></script>
<script src="/config.js"></script>
<script src="/app.js"></script>
<script src="/sounds.js"></script>
<script>
  applyLang(currentLang);
  const id = new URLSearchParams(location.search).get("id");
  let order;
  let suppressNextSound = false;

  let lastOrderJson = "";
  let lastUnread = 0;

  async function refresh() {
    if (document.getElementById("quote-modal").classList.contains("show")) return;
    try {
      const fresh = await api(`/api/orders/${id}`);
      const json = JSON.stringify(fresh);
      if (json === lastOrderJson) return;
      const oldStatus = order?.status;
      const statusChanged = oldStatus && fresh.status !== oldStatus;
      if (statusChanged && !suppressNextSound) {
        playNotificationSound();
      }
      if ((fresh.unread_count || 0) > lastUnread) {
        playChatSound();
      }
      lastUnread = fresh.unread_count || 0;
      suppressNextSound = false;
      lastOrderJson = json;
      order = fresh;
      render();
    } catch {}
  }

  (async () => {
    const me = await requireAuth("pharmacy");
    if (!me) return;
    document.getElementById("nav-mount").innerHTML = renderPharmacyNav("/pharmacy/orders");
    if (!id) { location.href = "/pharmacy/orders"; return; }
    try {
      order = await api(`/api/orders/${id}`);
      lastOrderJson = JSON.stringify(order);
      render();
      maybeAutoExtract();
      startPolling(refresh, 4000);
    } catch (err) { toast(err.message, "error"); }
  })();

  let autoTriggered = false;
  function maybeAutoExtract() {
    if (autoTriggered || !order) return;
    if (order.ai_status === "none" && order.prescription_path &&
        window.SAYDALIYATI_CONFIG && window.SAYDALIYATI_CONFIG.AI_ENABLED) {
      autoTriggered = true;
      triggerExtraction();
    }
  }

  async function triggerExtraction() {
    try {
      await api(`/api/orders/${id}/extract`, { method: "POST" });
      await refresh();
    } catch (err) { toast(err.message, "error"); }
  }
  window.triggerExtraction = triggerExtraction;

  function render() {
    const o = order;
    const isFinal = ["completed", "cancelled", "rejected"].includes(o.status);
    document.getElementById("chat-fab").href = `/pharmacy/chat?order=${o.id}`;
    document.getElementById("chat-fab").classList.toggle("hidden", isFinal);
    const fab = document.getElementById("chat-fab");
    fab.classList.toggle("fab-with-dot", (o.unread_count || 0) > 0);
    let dot = fab.querySelector(".unread-dot");
    if ((o.unread_count || 0) > 0 && !dot) {
      fab.insertAdjacentHTML("beforeend", '<span class="unread-dot"></span>');
    } else if (!(o.unread_count || 0) && dot) {
      dot.remove();
    }

    document.getElementById("root").innerHTML = `
      <!-- Status banner -->
      <div class="flex items-center justify-between mb-6">
        ${statusPill(o.status)}
        <span class="muted text-sm">${formatDate(o.created_at)} · ${formatTime(o.created_at)}</span>
      </div>

      <!-- Customer info -->
      <div class="card mb-4" style="display:flex;align-items:center;gap:0.875rem">
        ${avatarHtml(o.client_name || "•", "md")}
        <div class="flex-1" style="min-width:0">
          <strong style="display:block">${o.client_name || ""}</strong>
          <span class="muted text-sm" dir="ltr">${formatPhone(o.client_phone)}</span>
        </div>
        ${o.client_phone ? `<a href="tel:${o.client_phone}" class="btn btn-secondary btn-sm">${currentLang === "ar" ? "اتصل" : "Call"}</a>` : ""}
      </div>

      <!-- Fulfillment + address -->
      <div class="card mb-4">
        <div class="info-grid">
          <div class="info-cell">
            <div class="label">${currentLang === "ar" ? "الاستلام" : "Fulfillment"}</div>
            <div class="value">${o.fulfillment === "delivery" ? t("client.delivery") : t("client.pickup")}</div>
          </div>
          ${o.fulfillment === "delivery" && o.delivery_address ? `
            <div class="info-cell" style="grid-column: span 2">
              <div class="label">${t("client.address")}</div>
              <div class="value">${o.delivery_address}</div>
            </div>
          ` : ""}
        </div>
        ${o.notes ? `
          <div class="info-cell mt-4">
            <div class="label">${currentLang === "ar" ? "ملاحظات" : "Notes"}</div>
            <div class="value" style="font-weight:400">${o.notes}</div>
          </div>
        ` : ""}
      </div>

      ${aiExtractionCard(o, "pharmacy")}

      <!-- Prescription -->
      <div class="section-header"><h2>${t("client.prescription")}</h2></div>
      <div class="card mb-4">
        ${o.prescription_path ? `
          <a href="/uploads/${o.prescription_path}" target="_blank">
            <img src="/uploads/${o.prescription_path}" class="rx-thumb" alt="prescription"
                 onerror="this.outerHTML='<div class=&quot;flex items-center gap-3&quot; style=&quot;padding:0.5rem 0&quot;><div class=&quot;avatar avatar-md avatar-blue&quot;>📄</div><div><strong>PDF</strong><br><span class=&quot;muted text-sm&quot;>${o.prescription_path.split('/').pop()}</span></div></div>'">
          </a>` : `<p class="muted text-sm" style="margin:0">${currentLang === "ar" ? "ما في وصفة مرفقة." : "No prescription attached."}</p>`}
      </div>

      <!-- Quote (if exists) -->
      ${o.total_jod != null ? `
        <div class="card mb-4" style="background: linear-gradient(135deg, var(--mint-soft) 0%, rgba(0,229,168,0.04) 100%); border-color: rgba(0,229,168,0.25)">
          <div class="flex items-center justify-between">
            <span class="muted">${t("client.total")}</span>
            <strong style="font-size:1.5rem; color: var(--mint)">${o.total_jod} ${t("common.jod")}</strong>
          </div>
        </div>
      ` : ""}

      <!-- Action buttons by status -->
      ${actionsFor(o.status, o.fulfillment)}
    `;
  }

  function actionsFor(s, fulfillment) {
    if (s === "pending") return `
      <div class="flex gap-3 mb-4">
        <button class="btn btn-danger flex-1" onclick="updateStatus('rejected')">
          <span data-i18n="pharmacy.reject">${t("pharmacy.reject")}</span>
        </button>
        <button class="btn btn-primary flex-1" onclick="openModal()">
          <span data-i18n="pharmacy.sendQuote">${t("pharmacy.sendQuote")}</span>
        </button>
      </div>`;
    if (s === "confirmed") return `
      <button class="btn btn-primary btn-block mb-4" onclick="updateStatus('preparing')">
        ${t("pharmacy.markPreparing")}
      </button>`;
    if (s === "preparing") {
      const next = fulfillment === "delivery" ? "out_for_delivery" : "ready_for_pickup";
      const label = fulfillment === "delivery" ? t("pharmacy.markOut") : t("pharmacy.markReady");
      return `<button class="btn btn-primary btn-block mb-4" onclick="updateStatus('${next}')">${label}</button>`;
    }
    if (s === "ready_for_pickup" || s === "out_for_delivery") return `
      <button class="btn btn-primary btn-block mb-4" onclick="updateStatus('completed')">
        ${t("pharmacy.markCompleted")}
      </button>`;
    return "";
  }

  async function updateStatus(newStatus) {
    try {
      suppressNextSound = true;
      await api(`/api/orders/${id}`, { method: "PATCH", body: { status: newStatus } });
      toast(t("common.saved"), "success");
      await refresh();
    } catch (err) {
      suppressNextSound = false;
      toast(err.message, "error");
    }
  }

  function openModal() { document.getElementById("quote-modal").classList.add("show"); }
  function closeModal() { document.getElementById("quote-modal").classList.remove("show"); }
  document.getElementById("quote-modal").addEventListener("click", (e) => {
    if (e.target.id === "quote-modal") closeModal();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeModal();
  });

  document.getElementById("quote-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const total = parseFloat(e.target.elements.total.value);
    try {
      suppressNextSound = true;
      await api(`/api/orders/${id}`, { method: "PATCH", body: { status: "quoted", total_jod: total } });
      closeModal();
      await refresh();
      toast(t("common.saved"), "success");
    } catch (err) {
      suppressNextSound = false;
      toast(err.message, "error");
    }
  });

  window.openModal = openModal; window.closeModal = closeModal; window.updateStatus = updateStatus;
</script>
</body>
</html>
