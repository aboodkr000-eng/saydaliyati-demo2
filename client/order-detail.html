<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order · صيدليتي</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .quote-card {
      background: linear-gradient(135deg, var(--mint-soft) 0%, rgba(0,229,168,0.04) 100%);
      border: 1px solid rgba(0,229,168,0.25);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
    }
    .quote-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.625rem 0;
    }
    .quote-row.total {
      border-top: 1px dashed rgba(0,229,168,0.3);
      margin-top: 0.5rem; padding-top: 1rem;
    }
    .quote-row.total .v {
      font-size: 1.5rem; font-weight: 700;
      color: var(--mint);
    }
    .rx-thumb {
      width: 100%; max-height: 14rem;
      border-radius: var(--radius);
      object-fit: cover;
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .sticky-chat {
      position: fixed; bottom: 5rem; inset-inline-end: 1rem;
      z-index: 20;
    }
    @media (min-width: 768px) {
      .sticky-chat { bottom: 1.5rem; }
    }
  </style>
</head>
<body>

<div id="nav-mount"></div>

<main class="container">
  <div class="page-header">
    <a href="/client/orders" class="btn btn-secondary btn-sm">
      <svg class="rtl-flip" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      <span data-i18n="common.back">رجوع</span>
    </a>
  </div>

  <div id="root"><div class="skeleton skeleton-card" style="height: 12rem"></div></div>
</main>

<a id="chat-fab" class="btn btn-white sticky-chat hidden" href="#">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
  <span data-i18n="client.chatPharmacy">محادثة</span>
</a>

<script src="/i18n.js"></script>
<script src="/config.js"></script>
<script src="/app.js"></script>
<script src="/sounds.js"></script>
<script>
  applyLang(currentLang);
  const id = new URLSearchParams(location.search).get("id");
  let order;
  let suppressNextSound = false;

  const STAGES = ["pending", "quoted", "confirmed", "preparing", "ready_for_pickup", "completed"];

  function statusIcon(s) {
    if (s === "completed") return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    if (s === "cancelled" || s === "rejected") return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    if (s === "out_for_delivery") return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6h3l3 5"/></svg>';
    if (s === "ready_for_pickup") return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 16h6"/><path d="m22 16-3-3"/><path d="m22 16-3 3"/><path d="M8 17h8"/><circle cx="12" cy="11" r="6"/></svg>';
    if (s === "preparing") return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 11h1a3 3 0 0 1 0 6h-1"/><path d="M5 11h9v8a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>';
    if (s === "quoted") return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>';
    if (s === "confirmed") return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
    return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
  }

  let lastOrderJson = "";
  let lastUnread = 0;

  async function refresh() {
    try {
      const fresh = await api(`/api/orders/${id}`);
      const json = JSON.stringify(fresh);
      if (json === lastOrderJson) return;
      const oldStatus = order?.status;
      const newStatus = fresh.status;
      const statusChanged = oldStatus && newStatus !== oldStatus;
      if (statusChanged && !suppressNextSound) {
        playNotificationSound();
      }
      // Chat sound when a new message lands while we're on this page (but not in chat)
      if ((fresh.unread_count || 0) > lastUnread) {
        playChatSound();
      }
      lastUnread = fresh.unread_count || 0;
      suppressNextSound = false;
      lastOrderJson = json;
      order = fresh;
      render();
    } catch {}
  }

  async function init() {
    const me = await requireAuth("client");
    if (!me) return;
    document.getElementById("nav-mount").innerHTML = renderClientNav("/client/orders");
    if (!id) { location.href = "/client/orders"; return; }
    try {
      order = await api(`/api/orders/${id}`);
      lastOrderJson = JSON.stringify(order);
      render();
      maybeAutoExtract();
      // Real-time updates: re-fetch every 4 seconds, only re-render if changed
      startPolling(refresh, 4000);
    } catch (err) { toast(err.message, "error"); }
  }

  // Auto-run AI once if this order has a prescription but was never scanned
  // (e.g. placed before the Gemini key was configured).
  let autoTriggered = false;
  function maybeAutoExtract() {
    if (autoTriggered || !order) return;
    if (order.ai_status === "none" && order.prescription_path &&
        window.SAYDALIYATI_CONFIG && window.SAYDALIYATI_CONFIG.AI_ENABLED) {
      autoTriggered = true;
      triggerExtraction();
    }
  }

  async function triggerExtraction() {
    try {
      await api(`/api/orders/${id}/extract`, { method: "POST" });
      await refresh();
    } catch (err) { toast(err.message, "error"); }
  }
  window.triggerExtraction = triggerExtraction;

  function render() {
    const o = order;
    const pharmName = currentLang === "ar" ? o.pharmacy_name_ar : o.pharmacy_name_en;
    const isFinal = ["completed", "cancelled", "rejected"].includes(o.status);
    const isCancellable = ["pending", "quoted"].includes(o.status);

    const stages = [...STAGES];
    if (o.fulfillment === "delivery") stages.splice(4, 1, "out_for_delivery");
    const currentIdx = stages.indexOf(o.status);

    document.getElementById("chat-fab").href = `/client/chat?order=${o.id}`;
    document.getElementById("chat-fab").classList.toggle("hidden", isFinal);
    // Toggle red dot on the chat FAB
    const fab = document.getElementById("chat-fab");
    fab.classList.toggle("fab-with-dot", (o.unread_count || 0) > 0);
    let dot = fab.querySelector(".unread-dot");
    if ((o.unread_count || 0) > 0 && !dot) {
      fab.insertAdjacentHTML("beforeend", '<span class="unread-dot"></span>');
    } else if (!(o.unread_count || 0) && dot) {
      dot.remove();
    }

    const statusDescriptions = {
      pending: t("client.statusPendingDesc"),
      quoted: t("client.statusQuotedDesc"),
      confirmed: t("client.statusConfirmedDesc"),
      preparing: t("client.statusPreparingDesc"),
      ready_for_pickup: t("client.statusReadyDesc"),
      out_for_delivery: t("client.statusOutDesc"),
      completed: t("client.statusCompletedDesc"),
      cancelled: t("client.statusCancelledDesc"),
      rejected: t("client.statusRejectedDesc"),
    };

    document.getElementById("root").innerHTML = `
      <!-- STATUS HERO -->
      <div class="status-hero mb-6">
        <div class="status-hero-icon" style="background: ${o.status === "cancelled" || o.status === "rejected" ? "var(--red)" : "var(--mint)"}">
          ${statusIcon(o.status)}
        </div>
        ${statusPill(o.status)}
        <h2 class="mt-4">${t(`status.${o.status}`)}</h2>
        <p>${statusDescriptions[o.status] || ""}</p>

        ${currentIdx >= 0 && !isFinal ? `
          <div class="timeline mt-6">
            ${stages.map((s, i) => `
              <div class="timeline-step ${i < currentIdx ? "done" : i === currentIdx ? "current" : ""}">
                <div class="timeline-dot">
                  ${i < currentIdx ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>` : ""}
                </div>
                <div class="timeline-label">${t(`status.${s}`)}</div>
              </div>
            `).join("")}
          </div>
        ` : ""}
      </div>

      <!-- PHARMACY INFO -->
      <div class="card mb-4" style="display:flex;align-items:center;gap:0.875rem">
        ${avatarHtml(pharmName, "md")}
        <div class="flex-1">
          <strong style="display:block">${pharmName}</strong>
          <span class="muted text-sm">${o.fulfillment === "delivery" ? t("client.delivery") : t("client.pickup")}${o.delivery_address ? " · " + o.delivery_address : ""}</span>
        </div>
        <a href="/client/pharmacy?id=${o.pharmacy_id}" class="btn btn-secondary btn-sm">→</a>
      </div>

      <!-- QUOTE CARD (if quoted or beyond) -->
      ${o.total_jod != null ? `
        <div class="quote-card mb-4">
          <div class="quote-row">
            <span class="muted">${t("client.prescription")}</span>
            <span>${o.fulfillment === "delivery" ? t("client.delivery") : t("client.pickup")}</span>
          </div>
          ${o.fulfillment === "delivery" && o.delivery_fee_jod ? `
            <div class="quote-row">
              <span class="muted">${t("client.deliveryFee")}</span>
              <span>${o.delivery_fee_jod} ${t("common.jod")}</span>
            </div>
          ` : ""}
          <div class="quote-row total">
            <span style="font-weight:700">${t("client.total")}</span>
            <span class="v">${o.total_jod} ${t("common.jod")}</span>
          </div>
        </div>
      ` : ""}

      <!-- ACTION BUTTONS based on status -->
      ${o.status === "quoted" ? `
        <div class="flex gap-3 mb-4">
          <button class="btn btn-secondary flex-1" onclick="updateStatus('cancelled')">
            <span data-i18n="client.declineQuote">${t("client.declineQuote")}</span>
          </button>
          <button class="btn btn-primary flex-1" onclick="updateStatus('confirmed')">
            <span>${t("client.acceptQuote")}</span>
          </button>
        </div>
      ` : ""}
      ${o.status === "pending" ? `
        <button class="btn btn-danger btn-block mb-4" onclick="updateStatus('cancelled')">
          ${t("client.cancelOrder")}
        </button>
      ` : ""}
      ${o.status === "completed" ? `
        <a href="/client/review?order=${o.id}" class="btn btn-primary btn-block mb-4">
          ${iconStarFilled(16)} <span>${t("client.reviewOrder")}</span>
        </a>
      ` : ""}

      ${aiExtractionCard(o, "client")}

      <!-- PRESCRIPTION -->
      <div class="section-header"><h2>${t("client.prescription")}</h2></div>
      <div class="card mb-4">
        ${o.prescription_path ? `
          <a href="/uploads/${o.prescription_path}" target="_blank">
            <img src="/uploads/${o.prescription_path}" class="rx-thumb" alt="prescription"
                 onerror="this.outerHTML='<div class=&quot;flex items-center gap-3&quot; style=&quot;padding:0.5rem 0&quot;><div class=&quot;avatar avatar-md avatar-blue&quot;>📄</div><div><strong>PDF</strong><br><span class=&quot;muted text-sm&quot;>${o.prescription_path.split('/').pop()}</span></div></div>'">
          </a>` : `<p class="muted text-sm" style="margin:0">${currentLang === "ar" ? "ما في وصفة مرفقة." : "No prescription attached."}</p>`}
        ${o.notes ? `<p class="muted text-sm mt-4" style="border-top:1px solid var(--border);padding-top:1rem">${o.notes}</p>` : ""}
      </div>
    `;
  }

  async function updateStatus(newStatus) {
    try {
      suppressNextSound = true;
      await api(`/api/orders/${id}`, {
        method: "PATCH",
        body: { status: newStatus },
      });
      toast(t("common.saved"), "success");
      await refresh();
    } catch (err) {
      suppressNextSound = false;
      toast(err.message, "error");
    }
  }
  window.updateStatus = updateStatus;

  init();
</script>
</body>
</html>
