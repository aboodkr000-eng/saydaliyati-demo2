<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · صيدليتي</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

<div id="nav-mount"></div>

<main class="container">
  <header class="page-header">
    <p class="muted text-sm" id="welcome" style="margin:0 0 0.25rem"></p>
    <h1 class="page-title" data-i18n="admin.adminPanel">لوحة الإدارة</h1>
  </header>

  <!-- Top stats -->
  <div class="grid grid-4 mb-8" id="stats">
    <div class="skeleton" style="height:8rem"></div>
    <div class="skeleton" style="height:8rem"></div>
    <div class="skeleton" style="height:8rem"></div>
    <div class="skeleton" style="height:8rem"></div>
  </div>

  <!-- Breakdown -->
  <div class="grid" style="grid-template-columns:1fr;gap:1rem" id="breakdown">
    <div class="skeleton" style="height:10rem"></div>
  </div>
</main>

<script src="/i18n.js"></script>
<script src="/app.js"></script>
<script>
  applyLang(currentLang);
  let lastJson = "";

  function statCard(color, icon, label, value, sub) {
    return `
      <div class="stat-card">
        <div class="stat-card-icon" style="background: var(--${color}-soft); color: var(--${color})">${icon}</div>
        <div class="stat-card-label">${label}</div>
        <div class="stat-card-value">${value}</div>
        ${sub ? `<div class="muted text-xs mt-2">${sub}</div>` : ""}
      </div>
    `;
  }

  function pillRow(items) {
    if (items.length === 0) return `<span class="muted text-sm">${t("admin.noResults")}</span>`;
    return `<div class="flex gap-2 flex-wrap">${items.map(([label, value, color]) =>
      `<span class="pill pill-${color || 'muted'} pill-no-dot" style="font-size:0.8125rem"><strong>${value}</strong>&nbsp;·&nbsp;${label}</span>`
    ).join("")}</div>`;
  }

  function statusColor(s) {
    return ({pending:"amber",quoted:"blue",confirmed:"blue",preparing:"blue",ready_for_pickup:"purple",out_for_delivery:"purple",completed:"green",cancelled:"muted",rejected:"red"})[s] || "muted";
  }

  async function refresh() {
    try {
      const fresh = await api("/api/admin/stats");
      const json = JSON.stringify(fresh);
      if (json === lastJson) return;
      lastJson = json;
      render(fresh);
    } catch {}
  }

  function render(d) {
    document.getElementById("stats").innerHTML = `
      ${statCard("mint", '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
        t("admin.totalUsers"), d.users_total)}
      ${statCard("blue", '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/></svg>',
        t("admin.totalPharmacies"), d.pharmacies_total,
        `${d.pharmacies_verified} ${t("admin.verified")}`)}
      ${statCard("purple", '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>',
        t("admin.totalOrders"), d.orders_total)}
      ${statCard("green", '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
        t("admin.totalRevenue"), `${(d.revenue_total || 0).toFixed(2)} ${t("common.jod")}`)}
    `;

    const roleColors = { client: "mint", pharmacy: "blue", admin: "purple" };
    document.getElementById("breakdown").innerHTML = `
      <div class="card">
        <h3 class="text-lg font-bold mb-4">${t("admin.users")}</h3>
        ${pillRow(d.by_role.map(r => [t(`role.${r.role}`) || r.role, r.count, roleColors[r.role]]))}
      </div>
      <div class="card mt-4">
        <h3 class="text-lg font-bold mb-4">${t("admin.orders")}</h3>
        ${pillRow(d.by_status.map(s => [t(`status.${s.status}`), s.count, statusColor(s.status)]))}
      </div>
      <div class="card mt-4">
        <div class="flex justify-between items-center">
          <span class="muted text-sm">${t("admin.messages")}</span>
          <strong>${d.messages_total}</strong>
        </div>
        <div class="flex justify-between items-center mt-2">
          <span class="muted text-sm">${t("admin.reviewsCount")}</span>
          <strong>${d.reviews_total}</strong>
        </div>
      </div>
    `;
  }

  (async () => {
    const me = await requireAuth("admin");
    if (!me) return;
    document.getElementById("nav-mount").innerHTML = renderAdminNav("/admin/dashboard");
    document.getElementById("welcome").textContent = `${t("admin.welcome")} · ${me.full_name || ""}`;
    await refresh();
    startPolling(refresh, 8000);
  })();
</script>
</body>
</html>
